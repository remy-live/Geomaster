# Lance les sondes à chaque modification : elles ouvrent GéoMaster dans un vrai
# navigateur et vérifient que ce qui marchait marche encore.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  sondes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright pilote le navigateur ; c'est la seule dépendance, et elle
      # ne concerne que les tests — index.html, lui, n'en a aucune.
      - name: Installer Playwright et Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Lancer les sondes
        run: node tests/lancer.js
